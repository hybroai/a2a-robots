[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "a2a-robots"
version = "0.1.0"
description = "Expose robots as A2A agents with task-level skills and adapter-enforced safety limits"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "HYBRO AI", email = "info@hybro.ai" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["a2a-adapter>=0.4.1,<0.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.26", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/hybroai/a2a-robots"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_robots"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["a2a_robots", "a2a_robots_ros2", "a2a_robots_sharpa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
