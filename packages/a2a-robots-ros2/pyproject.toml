[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "a2a-robots-ros2"
version = "0.1.0"
description = "An allowlisted ROS 2 bridge over A2A, for robot bring-up and debugging"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "HYBRO AI", email = "info@hybro.ai" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# rclpy comes from the ROS 2 install, not PyPI, so it is not listed here.
dependencies = ["a2a-adapter>=0.2.19,<0.3"]

[project.urls]
Repository = "https://github.com/hybroai/a2a-robots"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_robots_ros2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
