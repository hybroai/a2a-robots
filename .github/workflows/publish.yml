name: Publish to PyPI

# release-please.yml dispatches this workflow on each new {component}-v{version}
# tag. It can also be run by hand, or by publishing a release from the GitHub UI.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Publish to TestPyPI instead of PyPI"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      package:
        description: "Component name when not on a release tag (TestPyPI from a branch)"
        required: false
        default: "a2a-robots"
        type: choice
        options:
          - a2a-robots
          - a2a-robots-lerobot
          - a2a-robots-pollen
          - a2a-robots-ros2
          - a2a-robots-sharpa

jobs:
  # Runs first so a run on the wrong ref fails before the test matrix. Later
  # jobs depend on it through test, so a failed check blocks both publish jobs.
  check-ref:
    name: Check the ref is the release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_dir: ${{ steps.check.outputs.package_dir }}
      package_name: ${{ steps.check.outputs.package_name }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the ref is the release tag
        id: check
        env:
          TEST_PYPI: ${{ github.event.inputs.test_pypi }}
          PACKAGE: ${{ github.event.inputs.package }}
        run: python .github/scripts/check_release_ref.py

  test:
    name: Test
    needs: check-ref
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build distribution
    needs: [check-ref, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        env:
          PACKAGE_DIR: ${{ needs.check-ref.outputs.package_dir }}
        run: python -m build "$PACKAGE_DIR" --outdir dist/

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_pypi == 'true'
    needs: [check-ref, build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ needs.check-ref.outputs.package_name }}
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_pypi != 'true')
    needs: [check-ref, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.check-ref.outputs.package_name }}
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
