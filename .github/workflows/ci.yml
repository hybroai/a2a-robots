name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --all-packages --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run pytest packages/a2a-robots-ros2
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sharpa-model
          key: sharpa-model-${{ hashFiles('packages/a2a-robots-sharpa/src/a2a_robots_sharpa/model.py') }}
      - run: uv run python -m a2a_robots_sharpa ${{ runner.temp }}/sharpa-model
      - run: uv run pytest packages/a2a-robots-sharpa
        env:
          SHARPA_MODEL_DIR: ${{ runner.temp }}/sharpa-model

  ros2-jazzy:
    # RclpyGateway against a live ROS 2 graph. rclpy comes from the ROS image,
    # so the venv sees the system site-packages.
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    env:
      A2A_ROBOTS_REQUIRE_ROS: "1"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      UV_PROJECT_ENVIRONMENT: /opt/a2a-venv
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends ros-jazzy-example-interfaces ros-jazzy-turtlesim
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --system-site-packages --python /usr/bin/python3 "$UV_PROJECT_ENVIRONMENT"
      - run: uv sync --frozen --all-packages --extra dev
      - run: source /opt/ros/jazzy/setup.bash && uv run pytest packages/a2a-robots-ros2
